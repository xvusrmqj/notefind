[project]
name = "notefind"
version = "0.1.0"
description = "RAG search over local notebooks (zim / obsidian / markdown) with pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdf>=4.0",
    "docx2txt>=0.8",
]

[project.scripts]
notefind = "notefind.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notefind"]
